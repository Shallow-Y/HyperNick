# HyperNick 中文消息 (简体中文)
# 支持颜色代码 (&a &b &l ...) 和 HEX 颜色代码 (&#FF55FF)
# {prefix} 为下方 prefix 的值, 其他占位符见各消息说明

prefix: '&7[&bHyperNick&7] &r'

no-permission: '{prefix}&c你没有权限执行此操作.'
usage: '{prefix}&e用法: &f/nick <名称|random|rank <等级>|skin <模式>|reuse|reset>'
nick-set: '{prefix}&a已将你的昵称设置为 &f{nick}&a.'
nick-reset: '{prefix}&a已取消匿名, 恢复真实身份.'
rank-set: '{prefix}&aRank 已设置为 &f{rank}&a.'
invalid-rank: '{prefix}&c无效的等级, 可选: &f{ranks}'
name-too-short: '{prefix}&c昵称过短, 最少 &f{min}&c 个字符.'
name-too-long: '{prefix}&c昵称过长, 最多 &f{max}&c 个字符.'
invalid-name: '{prefix}&c昵称包含非法字符.'
name-blocked: '{prefix}&c该昵称被禁用, 请更换.'
name-taken: '{prefix}&c该昵称已被其他玩家使用.'
name-conflict-reset: '{prefix}&c你的昵称与刚加入服务器的真实玩家 &f{name}&c 冲突, 已自动取消匿名.'
daily-limit: '{prefix}&c今日修改次数已达上限 (&f{limit}&c).'
not-nicked: '{prefix}&c你当前未启用匿名.'
already-nicked: '{prefix}&e你当前昵称: &f{nick}&e, 等级: &f{rank}&e.'
info-detail: |-
  {prefix}&e===== 匿名详细信息 =====
  {prefix}&e昵称: &f{nick}
  {prefix}&eRank: &f{rank}
  {prefix}&e真实 UUID: &7{realuuid}
  {prefix}&e模拟 UUID: &7{fakeuuid}
random-generated: '{prefix}&a已将你的昵称设置为 &f{nick}&a.'
config-reloaded: '{prefix}&a配置已重载.'
luckperms-missing: '{prefix}&c未检测到 LuckPerms, Rank 前缀功能不可用.'
protocollib-missing: '{prefix}&c未检测到 ProtocolLib, 数据包名称替换功能不可用.'
player-only: '{prefix}&c该指令只能由玩家执行.'
nick-reused: '{prefix}&a已重新使用上次昵称 &f{nick}&a.'
no-last-nick: '{prefix}&c你没有上次使用的昵称.'
skin-set: '{prefix}&a皮肤模式已设置为 &f{mode}&a.'
skin-usage: '{prefix}&e用法: &f/nick skin <REAL|RANDOM|RESET>'

actionbar-nicked: '&f你目前&c已匿名'

gui:
  main:
    line1: '&0匿名功能让你能使用不同的用户名进行游戏，避免被他人认出。'
    line2: '所有规则依然有效。你仍可能被举报，且所有匿名记录均会被记录。'
    start: '&0&n➤ 我已了解, 开始设置昵称'
  rank:
    header1: '&0帮助你设置昵称！'
    header2: '&0首先你需要选择你想要显示的&lRANK&0。'
  skin:
    desc: '&0哇哦！显示昵称时，你想要哪个皮肤？'
    real: '&0➤ 我的普通皮肤'
    reset: '&0➤ 史蒂夫/爱丽克丝皮肤'
    random: '&0➤ 随机皮肤'
  name:
    desc: '&0现在，请选择你要使用的&l昵称&0！'
    custom: '&0➤ 输入昵称'
    reuse: "&0➤ 使用上次昵称: '{last_nick}'"
    random: '&0➤ 使用随机昵称'
    unnick: '&0想要恢复平常状态，请输入：&0&l/unnick'
  error:
    title: '&0注意！你不能将{nick}用做你的昵称！'
    reason: '&0{reason}'
    retry: '&0➤ 重新输入昵称'
    random: '&0➤ 使用随机昵称'
    back: '&0➤ 返回昵称选择'
  random-result:
    desc: '&0我们为你随机生成了一个昵称:'
    use: ' &a&n使用'
    retry: ' &c&n重试'
    or-custom: '&0&n或者输入要使用的昵称。'

# HyperNick Messages (Français)
# Prend en charge les codes de couleur (&a &b &l ...) et les codes couleur HEX (&#FF55FF)
# {prefix} est la valeur de prefix ci-dessous, autres espaces réservés voir chaque message

prefix: '&7[&bHyperNick&7] &r'

no-permission: "{prefix}&cVous n'avez pas la permission d'effectuer cette action."
usage: '{prefix}&eUtilisation: &f/nick <nom|random|rank <grade>|skin <mode>|reuse|reset>'
nick-set: '{prefix}&aVotre pseudo a été défini sur &f{nick}&a.'
nick-reset: '{prefix}&aDéguisement retiré, identité restaurée.'
rank-set: '{prefix}&aGrade défini sur &f{rank}&a.'
invalid-rank: '{prefix}&cGrade invalide, disponibles: &f{ranks}'
name-too-short: '{prefix}&cPseudo trop court, minimum &f{min}&c caractères.'
name-too-long: '{prefix}&cPseudo trop long, maximum &f{max}&c caractères.'
invalid-name: '{prefix}&cLe pseudo contient des caractères invalides.'
name-blocked: '{prefix}&cCe pseudo est bloqué, veuillez en choisir un autre.'
name-taken: "{prefix}&cCe pseudo est déjà utilisé par un autre joueur."
name-conflict-reset: "{prefix}&cVotre pseudo entre en conflit avec un vrai joueur &f{name}&c qui vient de rejoindre, le déguisement a été automatiquement retiré."
daily-limit: '{prefix}&cLimite quotidienne de changements de pseudo atteinte (&f{limit}&c).'
not-nicked: '{prefix}&cVous n''êtes actuellement pas déguisé.'
already-nicked: '{prefix}&eVotre pseudo actuel: &f{nick}&e, grade: &f{rank}&e.'
info-detail: |-
  {prefix}&e===== Détails du Déguisement =====
  {prefix}&ePseudo: &f{nick}
  {prefix}&eGrade: &f{rank}
  {prefix}&eUUID Réel: &7{realuuid}
  {prefix}&eUUID Faux: &7{fakeuuid}
random-generated: '{prefix}&aVotre pseudo a été défini sur &f{nick}&a.'
config-reloaded: '{prefix}&aConfiguration rechargée.'
luckperms-missing: "{prefix}&cLuckPerms non détecté, fonction de préfixe de grade indisponible."
protocollib-missing: "{prefix}&cProtocolLib non détecté, fonction de remplacement de nom de paquet indisponible."
player-only: '{prefix}&cCette commande ne peut être exécutée que par un joueur.'
nick-reused: '{prefix}&aRéutilisation du dernier pseudo &f{nick}&a.'
no-last-nick: "{prefix}&cVous n'avez pas de pseudo précédent à réutiliser."
skin-set: '{prefix}&aMode de skin défini sur &f{mode}&a.'
skin-usage: '{prefix}&eUtilisation: &f/nick skin <REAL|RANDOM|RESET>'

actionbar-nicked: '&fVous êtes actuellement &cANONYME'

gui:
  main:
    line1: '&0Les surnoms vous permettent de jouer sous un autre nom pour ne pas être reconnu.'
    line2: '&0Toutes les règles s''appliquent. Vous pouvez être signalé et tout l''historique est conservé.'
    start: '&0&n➤ Compris, configurer mon surnom'
  rank:
    header1: '&0Configurons votre surnom !'
    header2: '&0D''abord, choisissez le &lRANG&0 à afficher avec le surnom.'
  skin:
    desc: '&0Génial ! Quel &lSKIN&0 souhaitez-vous avec le surnom ?'
    real: '&0➤ Mon skin normal'
    reset: '&0➤ Skin Steve/Alex'
    random: '&0➤ Skin aléatoire'
  name:
    desc: '&0Bien, maintenant choisissez le &lNOM&0 à utiliser !'
    custom: '&0➤ Entrer un surnom'
    reuse: "&0➤ Réutiliser '{last_nick}'"
    random: '&0➤ Utiliser un nom aléatoire'
    unnick: '&0Pour redevenir vous-même : &0&l/unnick'
  error:
    title: '&0Attention ! Vous ne pouvez pas utiliser {nick} comme surnom !'
    reason: '&0{reason}'
    retry: '&0➤ Ressaisir le surnom'
    random: '&0➤ Utiliser un surnom aléatoire'
    back: '&0➤ Retour à la sélection'
  random-result:
    desc: '&0Nous avons généré un surnom aléatoire :'
    use: ' &a&nUtiliser'
    retry: ' &c&nRéessayer'
    or-custom: '&0&nOu saisissez un surnom.'

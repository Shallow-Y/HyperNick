# HyperNick Сообщения (Русский)
# Поддерживает коды цветов (&a &b &l ...) и HEX-коды цветов (&#FF55FF)
# {prefix} — значение prefix ниже, другие плейсхолдеры см. в каждом сообщении

prefix: '&7[&bHyperNick&7] &r'

no-permission: '{prefix}&cУ вас нет прав для выполнения этого действия.'
usage: '{prefix}&eИспользование: &f/nick <имя|random|rank <ранг>|skin <режим>|reuse|reset>'
nick-set: '{prefix}&aВаш никнейм установлен на &f{nick}&a.'
nick-reset: '{prefix}&aМаскировка снята, личность восстановлена.'
rank-set: '{prefix}&aРанг установлен на &f{rank}&a.'
invalid-rank: '{prefix}&cНедопустимый ранг, доступные: &f{ranks}'
name-too-short: '{prefix}&cНикнейм слишком короткий, минимум &f{min}&c символов.'
name-too-long: '{prefix}&cНикнейм слишком длинный, максимум &f{max}&c символов.'
invalid-name: '{prefix}&cНикнейм содержит недопустимые символы.'
name-blocked: '{prefix}&cЭтот никнейм заблокирован, выберите другой.'
name-taken: '{prefix}&cЭтот никнейм уже используется другим игроком.'
name-conflict-reset: '{prefix}&cВаш никнейм конфликтует с реальным игроком &f{name}&c, который только что зашёл, маскировка была автоматически снята.'
daily-limit: '{prefix}&cДневной лимит изменений никнейма достигнут (&f{limit}&c).'
not-nicked: '{prefix}&cВ данный момент вы не замаскированы.'
already-nicked: '{prefix}&eВаш текущий никнейм: &f{nick}&e, ранг: &f{rank}&e.'
info-detail: |-
  {prefix}&e===== Детали маскировки =====
  {prefix}&eНикнейм: &f{nick}
  {prefix}&eРанг: &f{rank}
  {prefix}&eРеальный UUID: &7{realuuid}
  {prefix}&eПоддельный UUID: &7{fakeuuid}
random-generated: '{prefix}&aВаш никнейм установлен на &f{nick}&a.'
config-reloaded: '{prefix}&aКонфигурация перезагружена.'
luckperms-missing: '{prefix}&cLuckPerms не обнаружен, функция префикса ранга недоступна.'
protocollib-missing: '{prefix}&cProtocolLib не обнаружен, функция замены имени в пакетах недоступна.'
player-only: '{prefix}&cЭта команда может быть выполнена только игроком.'
nick-reused: '{prefix}&aПовторно использован последний никнейм &f{nick}&a.'
no-last-nick: '{prefix}&cУ вас нет предыдущего никнейма для повторного использования.'
skin-set: '{prefix}&aРежим скина установлен на &f{mode}&a.'
skin-usage: '{prefix}&eИспользование: &f/nick skin <REAL|RANDOM|RESET>'

actionbar-nicked: '&fВы сейчас &cАНОНИМНЫ'

gui:
  main:
    line1: '&0Никнеймы позволяют играть под другим именем, чтобы вас не узнали.'
    line2: '&0Все правила действуют. Вас могут пожаловаться, вся история сохраняется.'
    start: '&0&n➤ Понятно, настроить никнейм'
  rank:
    header1: '&0Давайте настроим ваш никнейм!'
    header2: '&0Сначала выберите, какой &lРАНГ&0 показывать с никнеймом.'
  skin:
    desc: '&0Отлично! Какой &lСКИН&0 хотите с никнеймом?'
    real: '&0➤ Мой обычный скин'
    reset: '&0➤ Скин Стива/Алекс'
    random: '&0➤ Случайный скин'
  name:
    desc: '&0Хорошо, теперь выберите &lИМЯ&0!'
    custom: '&0➤ Ввести никнейм'
    reuse: "&0➤ Повторно использовать '{last_nick}'"
    random: '&0➤ Случайное имя'
    unnick: '&0Чтобы снова стать собой: &0&l/unnick'
  error:
    title: '&0Внимание! Нельзя использовать {nick} как никнейм!'
    reason: '&0{reason}'
    retry: '&0➤ Ввести заново'
    random: '&0➤ Случайный никнейм'
    back: '&0➤ Назад к выбору'
  random-result:
    desc: '&0Мы сгенерировали случайный никнейм:'
    use: ' &a&nИспользовать'
    retry: ' &c&nЗаново'
    or-custom: '&0&nИли введите никнейм.'

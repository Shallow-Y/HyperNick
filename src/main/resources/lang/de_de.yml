# HyperNick Nachrichten (Deutsch)
# Unterstützt Farbcodes (&a &b &l ...) und HEX-Farbcodes (&#FF55FF)
# {prefix} ist der Wert von prefix unten, andere Platzhalter siehe jeweilige Nachricht

prefix: '&7[&bHyperNick&7] &r'

no-permission: '{prefix}&cDu hast keine Berechtigung, diese Aktion auszuführen.'
usage: '{prefix}&eVerwendung: &f/nick <name|random|rank <rang>|skin <modus>|reuse|reset>'
nick-set: '{prefix}&aDein Spitzname wurde auf &f{nick}&a gesetzt.'
nick-reset: '{prefix}&aVerkleidung entfernt, Identität wiederhergestellt.'
rank-set: '{prefix}&aRang auf &f{rank}&a gesetzt.'
invalid-rank: '{prefix}&cUngültiger Rang, verfügbar: &f{ranks}'
name-too-short: '{prefix}&cSpitzname zu kurz, mindestens &f{min}&c Zeichen.'
name-too-long: '{prefix}&cSpitzname zu lang, maximal &f{max}&c Zeichen.'
invalid-name: '{prefix}&cSpitzname enthält ungültige Zeichen.'
name-blocked: '{prefix}&cDieser Spitzname ist blockiert, bitte wähle einen anderen.'
name-taken: '{prefix}&cDieser Spitzname wird bereits von einem anderen Spieler verwendet.'
name-conflict-reset: '{prefix}&cDein Spitzname steht im Konflikt mit einem echten Spieler &f{name}&c, der gerade beigetreten ist. Die Verkleidung wurde automatisch entfernt.'
daily-limit: '{prefix}&cTägliches Limit für Spitznamenänderungen erreicht (&f{limit}&c).'
not-nicked: '{prefix}&cDu bist derzeit nicht verkleidet.'
already-nicked: '{prefix}&eDein aktueller Spitzname: &f{nick}&e, Rang: &f{rank}&e.'
info-detail: |-
  {prefix}&e===== Verkleidungsdetails =====
  {prefix}&eSpitzname: &f{nick}
  {prefix}&eRang: &f{rank}
  {prefix}&eEchte UUID: &7{realuuid}
  {prefix}&eGefälschte UUID: &7{fakeuuid}
random-generated: '{prefix}&aDein Spitzname wurde auf &f{nick}&a gesetzt.'
config-reloaded: '{prefix}&aKonfiguration neu geladen.'
luckperms-missing: '{prefix}&cLuckPerms nicht erkannt, Rang-Präfix-Funktion nicht verfügbar.'
protocollib-missing: '{prefix}&cProtocolLib nicht erkannt, Paket-Namensersetzung nicht verfügbar.'
player-only: '{prefix}&cDieser Befehl kann nur von einem Spieler ausgeführt werden.'
nick-reused: '{prefix}&aLetzten Spitznamen &f{nick}&a wiederverwendet.'
no-last-nick: '{prefix}&cDu hast keinen vorherigen Spitznamen zur Wiederverwendung.'
skin-set: '{prefix}&aSkin-Modus auf &f{mode}&a gesetzt.'
skin-usage: '{prefix}&eVerwendung: &f/nick skin <REAL|RANDOM|RESET>'

actionbar-nicked: '&fDu bist aktuell &cGETARNT'

gui:
  main:
    line1: '&0Mit dem Spitznamen-Feature kannst du unter einem anderen Namen spielen, ohne erkannt zu werden.'
    line2: 'Alle Regeln gelten weiterhin. Du kannst gemeldet werden und alle Aufzeichnungen werden gespeichert.'
    start: '&0&n➤ Verstanden, Spitznamen einrichten'
  rank:
    header1: '&0Lass uns deinen Spitznamen einrichten!'
    header2: '&0Wähle zuerst den &lRANG&0, den du anzeigen möchtest.'
  skin:
    desc: '&0Oh! Welchen Skin möchtest du mit deinem Spitznamen?'
    real: '&0➤ Mein normaler Skin'
    reset: '&0➤ Steve/Alex Skin'
    random: '&0➤ Zufälliger Skin'
  name:
    desc: '&0Wähle nun den &lSpitznamen&0, den du verwenden möchtest!'
    custom: '&0➤ Spitznamen eingeben'
    reuse: "&0➤ Letzten Spitznamen verwenden: '{last_nick}'"
    random: '&0➤ Zufälligen Spitznamen verwenden'
    unnick: '&0Um zurückzukehren: &0&l/unnick'
  error:
    title: '&0Achtung! Du kannst {nick} nicht als Spitznamen verwenden!'
    reason: '&0{reason}'
    retry: '&0➤ Spitznamen neu eingeben'
    random: '&0➤ Zufälligen Spitznamen verwenden'
    back: '&0➤ Zurück zur Spitznamen-Auswahl'
  random-result:
    desc: '&0Wir haben einen zufälligen Spitznamen für dich generiert:'
    use: ' &a&nVerwenden'
    retry: ' &c&nErneut'
    or-custom: '&0&nOder gib einen Spitznamen ein.'

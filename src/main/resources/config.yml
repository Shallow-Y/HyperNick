# ============================================================
#  HyperNick 配置文件
#  模仿 Hypixel Nickname 系统的匿名插件
#  颜色代码使用 & 符号 (例如 &a &l &6)
# ============================================================

# 语言文件 (对应 messages/ 文件夹下的文件名, 不含 .yml)
# 内置: zh_hans (简体中文), zh_hant (繁體中文), en_us (English), ja_jp (日本語), es_es (Español), de_de (Deutsch), fr_fr (Français), pt_pt (Português), ru_ru (Русский), ko_kr (한국어), it_it (Italiano)
lang: "zh_hans"

# 是否启用数据包级别的名称替换 (需要 ProtocolLib)
# 开启后, 其他玩家在 Tab 列表与头顶名牌中看到的"真实用户名"会被替换为昵称
# 关闭则仅修改聊天名/Tab显示名, 头顶名牌中间仍显示真实名
packet-disguise: true

# 是否启用计分板名牌前缀 (在头顶名牌上显示 Rank 前缀与颜色)
# 需要与 packet-disguise 配合: 数据包把用户名改成昵称, 队伍把昵称加前缀
scoreboard-nametag: true

# 是否接管聊天格式 (使用 LuckPerms 前缀 + 昵称渲染聊天)
# 开启后, 聊天以系统消息发送 (无签名), 彻底避免 fake UUID 导致的"聊天验证错误"
# 若服务器已安装 EssentialsX Chat / VentureChat 等聊天插件, 可关闭此项避免冲突
# 注意: 关闭后, 数据包监听器仍会尝试替换签名聊天的 sender UUID (安全网)
override-chat: true

# 是否在指令中将昵称解析为真实玩家名
# 开启后, 玩家可以使用 /tp NickName, /kill NickName 等指令操作已匿名玩家
resolve-nicknames-in-commands: true

# Rank 相关配置 (enable-group-prefix, group-mapping, ranks, random-rank-pool)
# 已移至 ranks.yml, 请在该文件中配置

# 聊天格式占位符: {prefix} {name} {suffix} {message}
# {prefix}/{suffix} 来自 LuckPerms, {name} 为昵称(或真实名)
# 昵称颜色自动继承前缀中最后一个颜色代码
# 支持传统颜色代码 (&a &b &l) 和 HEX 颜色代码 (&#FF55FF)
chat-format: "{prefix}{name}&r&7: &r{message}"

# ------------------------------------------------------------
#  数据库设置
# ------------------------------------------------------------
database:
  # 存储类型: sqlite (本地文件, 默认) 或 mysql (远程数据库)
  type: "sqlite"
  # MySQL 连接信息 (仅 type 为 mysql 时生效)
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    ssl: false

# ------------------------------------------------------------
#  昵称设置
# ------------------------------------------------------------
nick-settings:
  # GameProfile 名称上限为 16 字符
  min-length: 3
  max-length: 16
  # 每日最大修改次数 (-1 为无限)
  daily-limit: -1
  # 是否允许玩家自定义昵称 (false 则只能使用随机昵称, 更贴近 Hypixel)
  allow-custom: true
  # 昵称是否允许包含数字
  allow-numbers: true
  # 昵称是否允许包含下划线
  allow-underscore: true
  # 正则白名单 (留空则仅允许字母数字下划线). 例: "^[A-Za-z0-9_]+$"
  name-regex: ""
  # 禁用的昵称词表 (不区分大小写, 命中则拒绝)
  blocked-names:
    - "Notch"
    - "Dinnerbone"
    - "jeb_"
    - "admin"
    - "console"
    - "staff"

# ------------------------------------------------------------
#  随机昵称生成器
# ------------------------------------------------------------
name-generator:
  # 名称风格: ENGLISH / PINYIN / MIXED
  style: ENGLISH
  # 是否在随机名末尾追加随机数字 (降低撞名概率)
  append-number: true
  # 数字位数
  number-digits: 2
  adjectives:
    - Swift
    - Brave
    - Silent
    - Crimson
    - Frosty
    - Shadow
    - Golden
    - Mystic
    - Royal
    - Wild
  nouns:
    - Fox
    - Wolf
    - Hawk
    - Bear
    - Lion
    - Raven
    - Tiger
    - Eagle
    - Shark
    - Dragon

# ============================================================
#  HyperNick GUI - Name 选择页
#  玩家选择昵称来源
#  占位符:
#    {last_nick} - 上次使用的昵称
#    {lang:xxx}  - 引用 lang/ 语言文件中的条目
#  condition: has_last_nick - 仅当玩家有上次昵称时才显示该行
# ============================================================

title: HyperNick
author: HyperNick

lines:
- text: '{lang:gui.name.desc}'
- text: ''
- text: '{lang:gui.name.custom}'
  click: /nick gui name custom
- text: '{lang:gui.name.reuse}'
  click: /nick gui name reuse
  condition: has_last_nick
- text: '{lang:gui.name.random}'
  click: /nick gui name random
- text: ''
- text: '{lang:gui.name.unnick}'
# ============================================================
#  HyperNick GUI - 错误提示页
#  当昵称被禁用/已存在/非法时显示
#  占位符:
#    {nick}      - 被拒绝的昵称
#    {reason}    - 拒绝原因 (颜色代码)
#    {lang:xxx}  - 引用 lang/ 语言文件中的条目
# ============================================================

title: HyperNick
author: HyperNick

lines:
- text: '{lang:gui.error.title}'
- text: ''
- text: '{lang:gui.error.reason}'
- text: ''
- text: '{lang:gui.error.retry}'
  click: /nick gui name custom
- text: '{lang:gui.error.random}'
  click: /nick gui name random
- text: '{lang:gui.error.back}'
  click: /nick gui back name
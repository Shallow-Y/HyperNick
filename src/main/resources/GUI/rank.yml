# ============================================================
#  HyperNick GUI - Rank 选择页
#  玩家选择伪装等级
#  rank-template 中的占位符:
#    {prefix}  - Rank 前缀 (含颜色代码, 来自 ranks.yml)
#    {display} - Rank 名称大写
#    {key}     - Rank 键名 (小写, 用于指令)
#  rank-template 会为每个可用 Rank 重复渲染一次
# ============================================================

title: HyperNick
author: HyperNick

# 页面头部 (静态文本, 显示在 Rank 列表之前)
header:
- text: '&0帮助你设置昵称！'
- text: '&0首先你需要选择你想要显示的&lRANK&0。'
- text: ''

# Rank 条目模板 (为每个可用 Rank 重复渲染)
rank-template:
- text: '&0➤ &r{prefix}{display}'
  click: /nick gui selectrank {key}

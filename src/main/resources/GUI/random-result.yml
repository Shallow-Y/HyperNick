# ============================================================
#  HyperNick GUI - 随机昵称结果页
#  随机生成昵称后显示, 玩家选择使用或重新随机
#  占位符:
#    {nick} - 随机生成的昵称
# ============================================================

title: HyperNick
author: HyperNick

lines:
- text: '&0随机生成的昵称:'
- text: ''
- text: '&a&l{nick}'
- text: ''
- text: '&0➤ &a使用这个昵称'
  click: /nick gui confirm {nick}
- text: '&0➤ &e重新随机'
  click: /nick gui name random
- text: '&0➤ &7返回昵称选择'
  click: /nick gui back name

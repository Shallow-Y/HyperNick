# ============================================================
#  HyperNick GUI - 随机昵称结果页
#  随机生成昵称后显示, 玩家选择使用或重新随机
#  占位符:
#    {nick}      - 随机生成的昵称
#    {lang:xxx}  - 引用 lang/ 语言文件中的条目
# ============================================================

title: HyperNick
author: HyperNick

lines:
- text: '{lang:gui.random-result.desc}'
- text: '&0&l{nick}'
- text: ''
- text: '{lang:gui.random-result.use}'
  click: /nick gui confirm {nick}
- text: '{lang:gui.random-result.retry}'
  click: /nick gui name random
- text: ''
- text: '{lang:gui.random-result.or-custom}'
  click: /nick gui name custom
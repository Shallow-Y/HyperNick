# ============================================================
#  HyperNick GUI - Skin 选择页
#  玩家选择皮肤模式
#  click 指令中的 REAL/RANDOM/RESET 对应 NickData.SkinMode 枚举
#  文本通过 {lang:xxx} 占位符引用 lang/ 语言文件中的条目
# ============================================================

title: HyperNick
author: HyperNick

lines:
- text: '{lang:gui.skin.desc}'
- text: ''
- text: '{lang:gui.skin.real}'
  click: /nick gui selectskin REAL
- text: '{lang:gui.skin.reset}'
  click: /nick gui selectskin RESET
- text: '{lang:gui.skin.random}'
  click: /nick gui selectskin RANDOM
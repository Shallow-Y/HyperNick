name: HyperNick
version: '${version}'
main: com.hypernick.HyperNick
api-version: '1.21'
authors: [QianYun]
description: 模仿 Hypixel Nickname 系统的匿名插件, 通过 LuckPerms 前缀与数据包拦截实现 UUID+名称伪装, 服务端数据完全继承.
website: https://support.hypixel.net/hc/en-us/articles/360019603340-How-to-Use-Nicknames-on-Hypixel

# 软依赖: 缺少时插件仍可加载, 但对应功能会降级
softdepend:
  - LuckPerms
  - ProtocolLib
  - PlaceholderAPI

commands:
  nick:
    description: 管理匿名昵称 (模仿 Hypixel Nickname 系统)
    usage: |
      /nick - 查看当前匿名状态
      /nick <名称> - 设置自定义昵称
      /nick random - 随机昵称
      /nick rank <等级> - 设置伪装 Rank 前缀
      /nick info - 查看详细信息 (含 Fake UUID, 需透视权限)
      /nick reset - 取消匿名, 恢复真实身份
    aliases: [nickname, disguise]
    permission: hypernick.use

permissions:
  hypernick.use:
    description: 允许使用 /nick 指令
    default: op
  hypernick.random:
    description: 允许使用随机昵称
    default: op
  hypernick.rank:
    description: 允许选择伪装 Rank
    default: op
  hypernick.seeidentity:
    description: 拥有此权限的玩家可看到其他玩家的真实身份 (管理员透视)
    default: op
  hypernick.admin:
    description: 管理员权限 (重载配置等)
    default: op
  hypernick.bypass:
    description: 拥有此权限的玩家不会被匿名 (仅作用于自身, 一般无需设置)
    default: false

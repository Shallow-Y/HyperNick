name: HyperNick
version: '${version}'
main: com.hypernick.HyperNick
api-version: '1.21'
authors: [ShallowY_]
description: 模仿 Hypixel Nickname 系统的匿名插件, 通过 LuckPerms 前缀与数据包拦截实现 UUID+名称伪装, 服务端数据完全继承.
website: https://github.com/Shallow-Y/HyperNick

# 软依赖: 缺少时插件仍可加载, 但对应功能会降级
softdepend:
  - LuckPerms
  - ProtocolLib
  - PlaceholderAPI

commands:
  nick:
    description: 管理匿名昵称 (模仿 Hypixel Nickname 系统)
    usage: |
      /nick - 打开昵称设置 GUI
      /nick <名称> - 设置自定义昵称
      /nick random - 随机昵称
      /nick rank <等级> - 设置伪装 Rank 前缀
      /nick skin <REAL|RANDOM|RESET> - 设置皮肤模式
      /nick reuse - 重新使用上次昵称
      /nick info - 查看详细信息 (含 Fake UUID, 需透视权限)
      /nick reset - 取消匿名, 恢复真实身份
    aliases: [nickname, disguise]
    permission: hypernick.use
  nickadmin:
    description: 管理员指令 (重载配置等)
    usage: |
      /nickadmin reload - 重载配置
    permission: hypernick.admin
  unnick:
    description: 取消匿名 (同 /nick reset)
    usage: /unnick
    permission: hypernick.use

permissions:
  hypernick.use:
    description: 允许使用 /nick 指令
    default: op
  hypernick.admin:
    description: 管理员权限 (重载配置等)
    default: op
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = project.group
version = project.version

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'dmulloy2-repo'
        url = 'https://repo.dmulloy2.net/repository/public/'
    }
    maven {
        name = 'helpchat-repo'
        url = 'https://repo.helpch.at/releases'
    }
    maven {
        name = 'sonatype-repo'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
}

dependencies {
    // PaperMC API (Minecraft 26.2). Version like 26.2.build.<N>-stable, see
    // https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
    compileOnly 'io.papermc.paper:paper-api:26.2.build.98-stable'
    // LuckPerms API (prefix handling)
    compileOnly 'net.luckperms:api:5.5'
    // ProtocolLib (packet interception to replace GameProfile.name)
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'
    // PlaceholderAPI (placeholder expansion)
    compileOnly 'me.clip:placeholderapi:2.12.3'
    // bStats analytics (shaded & relocated via shadowJar)
    implementation 'org.bstats:bstats-bukkit:3.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Paper API 26.2 declares minimum JVM 25; override the consumer attribute so
// dependencies resolve while the compiler still emits Java 21 bytecode.
configurations.configureEach {
    if (canBeResolved) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName.set('HyperNick-bukkit')
    archiveVersion.set(project.version)
    archiveClassifier.set('plain')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// bStats is shaded & relocated via shadowJar to avoid conflicts with other plugins
shadowJar {
    archiveBaseName.set('HyperNick-bukkit')
    archiveVersion.set(project.version)
    archiveClassifier.set('')
    relocate 'org.bstats', 'com.hypernick.bstats'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn shadowJar